<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mãos pela Cidade — Voluntariado comunitário</title>
  <meta name="description" content="Mãos pela Cidade: cadastre-se como voluntário, receba oportunidades compatíveis com o seu perfil e participe das ações da sua cidade.">
  <meta name="theme-color" content="#FFF8F1">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <script>
    // Aplica o tema salvo (ou o do sistema) antes da primeira pintura, evitando o "flash" de cor.
    (function () {
      var t = 'light';
      try {
        t = localStorage.getItem('tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) { /* sem armazenamento: usa o tema claro */ }
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/tema.css" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">
  <link href="css/landing.css" rel="stylesheet">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>
  <div class="grao" aria-hidden="true"></div>

  <button type="button" id="pular" class="visually-hidden-focusable btn btn-light position-absolute m-2" style="z-index:3000">Ir para o conteúdo</button>
  <header id="topo" class="topo-raiz"></header>
  <main id="conteudo" class="container conteudo" tabindex="-1">
    <div id="app" aria-live="polite">
      <div class="sk-bloco" role="status"><span class="visually-hidden">Carregando…</span>
        <div class="sk sk-titulo"></div>
        <div class="row g-3"><div class="col-12 col-md-6 col-xl-4"><div class="sk sk-card"></div></div><div class="col-12 col-md-6 col-xl-4 d-none d-md-block"><div class="sk sk-card"></div></div><div class="col-xl-4 d-none d-xl-block"><div class="sk sk-card"></div></div></div>
      </div>
    </div>
  </main>
  <footer id="rodape" class="rodape"></footer>
  <div class="toast-container position-fixed end-0 p-3" id="toasts" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <noscript><p class="container py-4">Este sistema precisa de JavaScript habilitado para funcionar.</p></noscript>
</body>
</html>
