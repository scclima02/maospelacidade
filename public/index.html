<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Voluntariado Municipal</title>
  <meta name="description" content="Sistema de Gestão de Voluntariado Municipal: cadastre-se como voluntário e participe das ações da sua cidade.">
  <meta name="theme-color" content="#1d4e89">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4e89'/%3E%3Cpath d='M16 24s-7-4.4-7-9.6A4.1 4.1 0 0 1 16 12a4.1 4.1 0 0 1 7 2.4C23 19.6 16 24 16 24z' fill='%23fff'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <button type="button" id="pular" class="visually-hidden-focusable btn btn-light position-absolute m-2" style="z-index:2000">Ir para o conteúdo</button>
  <header id="topo"></header>
  <main id="conteudo" class="container py-4 flex-grow-1" tabindex="-1">
    <div id="app" aria-live="polite">
      <div class="text-center text-muted py-5">
        <div class="spinner-border" role="status"></div>
        <p class="mt-2">Carregando…</p>
      </div>
    </div>
  </main>
  <footer id="rodape" class="rodape py-3 mt-auto"></footer>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <noscript><p class="container py-4">Este sistema precisa de JavaScript habilitado para funcionar.</p></noscript>
</body>
</html>
